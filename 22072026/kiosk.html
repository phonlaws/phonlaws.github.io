<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <script>
    (function(){
      try{
        var saved = localStorage.getItem("kioskTheme");
        var theme = saved === "light" ? "light" : "dark";
        document.documentElement.dataset.kioskTheme = theme;
      }catch(e){
        document.documentElement.dataset.kioskTheme = "dark";
      }
    })();
  </script>
  <title>งานเสี่ยง • จอเครื่องกลาง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body class="mode-kiosk">
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar kioskbar">
    <div class="brand">
      <div class="logo" title="Risk Work">RW</div>
      <div>
        <h1>งานเสี่ยง • หน้างานที่กำลังเปิด</h1>
        <p>รายงาน งานเสี่ยงที่เปิดอยู่</p>
      </div>
    </div>

    <div class="stats" aria-label="สรุปสถานะ">
      <div class="stat">
        <span class="stat-label">งานที่เปิดอยู่</span>
        <span class="stat-value" id="kpiOpen">0</span>
      </div>
      <div class="stat danger">
        <span class="stat-label">เกินเวลา</span>
        <span class="stat-value" id="kpiOver">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">อัปเดตล่าสุด</span>
        <span class="stat-value small" id="lastUpdated">—</span>
      </div>

      <button id="kioskThemeToggle" class="kiosk-theme-toggle" type="button"
              aria-label="เปลี่ยนเป็นโหมดสว่าง" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">☀</span>
        <span class="theme-text">โหมดสว่าง</span>
      </button>
    </div>
  </header>

  <main class="container kiosk-container">
    <section class="panel kiosk-panel">
      <div class="panel-head">
        <h2>รายการงานที่กำลังเปิดอยู่</h2>
        <span class="hint">อัปเดตอัตโนมัติ (ดึงจากเครื่องที่รัน server)</span>
      </div>

      <div id="jobsEmpty" class="empty">ไม่มีงานเสี่ยงที่เปิดอยู่</div>
      <div id="jobsList" class="cards kiosk-cards"></div>
    </section>
  </main>

  <script src="app.js?v=5"></script>
</body>
</html>
